services:
  adminer:
    image: adminer:4.8.1-standalone
    ports:
      - "8080:8080"
    environment:
      ADMINER_DESIGN: dracula
    volumes:
      - ../legacy/adminer4-plugin.php:/var/www/html/plugins-enabled/table-prefix-groups.php:ro
      - ../table-prefix-groups.php:/var/www/html/table-prefix-groups.php:ro
      - ../assets/adminer-prefix-groups.css:/var/www/html/adminer-prefix-groups.css:ro
